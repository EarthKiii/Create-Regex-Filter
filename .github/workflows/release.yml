name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The jar is named after mod_version, so a tag that does not match it would publish the wrong file.
      - name: Check that the tag matches mod_version
        run: |
          mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$mod_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$mod_version in gradle.properties"
            exit 1
          fi

  build:
    needs: check-version
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: create_regex_filter
          path: dist

      # Tags with a suffix (v1.1.0-beta.1) are published as pre-releases.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            $prerelease
