// Based on the official NeoForge 1.21.1 ModDevGradle MDK
// (https://github.com/NeoForgeMDKs/MDK-1.21.1-ModDevGradle), trimmed to what this mod needs,
// plus a separate "gametest" source set used only by the gameTestServer run (never shipped).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // Create and Ponder (Catnip)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Create'
                url = 'https://maven.createmod.net'
            }
        }
        filter {
            includeGroup 'com.simibubi.create'
            includeGroup 'net.createmod.ponder'
            includeGroup 'dev.engine-room.flywheel'
        }
    }
    // JEI
    exclusiveContent {
        forRepository {
            maven {
                name = 'BlameJared'
                url = 'https://maven.blamejared.com'
            }
        }
        filter {
            includeGroup 'mezz.jei'
        }
    }
    // EMI
    exclusiveContent {
        forRepository {
            maven {
                name = 'TerraformersMC'
                url = 'https://maven.terraformersmc.com/releases'
            }
        }
        filter {
            includeGroup 'dev.emi'
        }
    }
    mavenCentral()
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    addModdingDependenciesTo(sourceSets.gametest)

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        // Runs the automated tests in src/gametest and exits (non-zero exit code on failure).
        // `./gradlew runGameTestServer`
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

dependencies {
    // Create. transitive = false: its POM lists every optional integration (JEI, FTB, JourneyMap, ...)
    // as runtime dependencies, and the libraries it really needs are already inside its jar (jar-in-jar).
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}") {
        transitive = false
    }
    compileOnly("net.createmod.ponder:ponder-neoforge:${ponder_version}") {
        transitive = false
    }
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}") {
        transitive = false
    }

    // RE2J, bundled into the mod jar with jar-in-jar (NeoForge loads nested plain jars as game libraries).
    jarJar(implementation("com.google.re2j:re2j")) {
        version {
            strictly "[${re2j_version},2)"
            prefer re2j_version
        }
    }
    // Dev runs do not read jar-in-jar: non-mod libraries have to be put on the game's classpath explicitly.
    additionalRuntimeClasspath("com.google.re2j:re2j:${re2j_version}")

    // Recipe viewer integrations (drag and drop into the test slot). Compile-only: both are optional.
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
    // To try one in the dev client: ./gradlew runClient -Pviewer=jei (or emi)
    def viewer = providers.gradleProperty('viewer').getOrElse('none')
    if (viewer == 'jei')
        runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    else if (viewer == 'emi')
        runtimeOnly("dev.emi:emi-neoforge:${emi_version}")

    // Plain unit tests of the regex layer (no Minecraft needed): `./gradlew test`
    testImplementation(platform('org.junit:junit-bom:5.11.4'))
    testImplementation('org.junit.jupiter:junit-jupiter')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// Expands ${...} properties in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            create_version_range   : create_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
