# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment parameter names (dev-time only). https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties. Latest NeoForge versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.251
# Create 6.0.10 itself requires NeoForge 21.1.219 or newer.
neo_version_range=[21.1.219,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

# Create (https://maven.createmod.net). The full jar bundles Registrate, Flywheel and Ponder (jar-in-jar),
# so it is the only Create artifact needed on the runtime classpath.
create_version=6.0.10-280
# Version range written to neoforge.mods.toml. The filter API used here (FilterItem#makeStackWrapper,
# FilterItemStack subclasses) is the one from Create 6.0.x.
create_version_range=[6.0.10,6.1)
# Ponder contains Catnip, which Create's GUI classes extend, and Create's GUI helpers mention Flywheel
# types. Both are compile-only: Create ships them at runtime.
ponder_version=1.0.82+mc1.21.1
flywheel_version=1.0.6

# Recipe viewers, compile-only (the JEI version is the one Create 6.0.10 is built against).
jei_version=19.21.0.247
emi_version=1.1.24+1.21.1

# RE2J: linear-time regular expressions (Google's Java port of RE2). Bundled with jar-in-jar.
re2j_version=1.8

## Mod Properties
mod_id=create_regex_filter
mod_name=Create: Regex Filter
mod_license=MIT
mod_version=1.0.1
mod_group_id=com.earthkiii.createregexfilter
